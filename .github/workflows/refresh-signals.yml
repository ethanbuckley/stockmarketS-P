name: Refresh signals

# Weekly regeneration of data/latest_signals.csv and data/candidate_prices.csv
# so the dashboard's "updated weekly" claim stays true without a laptop run.
on:
  schedule:
    - cron: "0 22 * * 5"   # Fridays 22:00 UTC, after the US close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-signals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-full.txt
      - name: Cache FinBERT weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: finbert-prosusai-v1
      # CPU-only torch first: the default Linux wheel pulls several GB of CUDA
      # libraries the runner cannot use. requirements-full then sees torch
      # already satisfied.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-full.txt
      - run: python generate_signals.py
      - name: Commit refreshed artefacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_signals.csv data/candidate_prices.csv
          if git diff --cached --quiet; then
            echo "Signals unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "data: weekly signals refresh ($(date -u +%F))"
          git push
