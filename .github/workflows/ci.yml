name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      # Pinned resolution of requirements.txt + requirements-dev.txt (Linux,
      # py3.12). No torch or transformers: screener.py imports them lazily and
      # the tests stub the sentiment model. Regenerate with the command at the
      # top of the lock file.
      - run: pip install -r requirements-dev.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
